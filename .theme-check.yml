# Theme Check Configuration
# https://shopify.dev/docs/themes/tools/theme-check/configuration
#
# NOTE: theme-check 4.x (shipped with @shopify/cli 4.x) no longer honours the
# per-check `ignore:` key that this file previously relied on — only `enabled:`
# takes effect. Verified by experiment: setting `ignore:` changes nothing, while
# `enabled: false` does. The two checks below are therefore disabled outright
# rather than scoped to specific files.

# App blocks (Judge.me, Moast, Selleasy, DealEasy, Shopify Forms) are installed
# in production but their block files do not exist in the repo, so every
# template referencing them errors locally. Nothing to fix in this codebase.
JSONMissingBlock:
  enabled: false

# The Avada SEO app injects into content_for_header by design. These files are
# auto-synced from the live theme rather than authored here, and the store owner
# cannot change vendor app output.
ContentForHeaderModification:
  enabled: false

# Previously disabled for sections/header-marquee.liquid; the missing key
# (t:content.share_information_about_your) is now defined in the schema locales,
# so this check runs normally again.
TranslationKeyExists:
  enabled: true
