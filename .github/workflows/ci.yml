name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Horizon 4.x needs @shopify/cli 4.x, which requires Node >=22.12.0.
          # Theme Check runs through that CLI, so Node 20 fails here.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:js
        continue-on-error: false

      - name: Run Stylelint
        run: npm run lint:css
        continue-on-error: false

      - name: Run Prettier check
        run: npm run format:check
        continue-on-error: false

      - name: Run Theme Check
        run: npm run lint:theme
        continue-on-error: false
